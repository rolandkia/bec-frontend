<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover : le contenu occupe tout l'écran (encoche incluse) ;
         les gouttières `px-safe` / `pb-safe` prennent le relais aux bords. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La barre d'adresse mobile suit le thème du système, comme le site. Elle
         s'accorde à la BASE de page (papier ou noir élevé), pas au hero : c'est
         le fond qu'on voit dès qu'on a défilé de quelques pixels. -->
    <meta name="theme-color" content="#F7F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Bordeaux Étudiants Club Athlétisme : actualités, calendrier des compétitions, records et athlètes du club."
    />
    <!-- Polices servies par Google et NON auto-hébergées, volontairement : le
         serveur du site est aux États-Unis (cf. DEPLOYMENT.md) alors que Google
         les livre depuis un point de présence français. Les rapatrier dans
         `dist/` les rendrait plus lentes pour le public du club, pas plus
         rapides. À revoir si la VM passe un jour en Europe. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Photos d'athlètes, galerie et couvertures d'articles viennent toutes de
         Cloudinary. Sans cette ligne, la poignée de main DNS + TCP + TLS n'est
         engagée qu'une fois la première <img> découverte dans le DOM, soit un
         aller-retour de retard sur chaque page illustrée. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Photo d'OUVERTURE de la page, demandée DÈS L'ANALYSE DU HTML.
         Sans cela, elle n'est découverte qu'une fois le JavaScript téléchargé
         PUIS exécuté, puisque c'est React qui écrit la balise <img> — et, hors
         accueil, qu'une fois téléchargé en plus le morceau de la page demandée,
         chargé à la demande : sur un téléphone, 1,1 à 1,3 s après le début du
         chargement (mesuré sur /club, /athletes, /mag…), alors qu'elle est le
         plus grand élément du premier écran. Seul l'accueil en profitait.

         Pourquoi un script et non une balise <link> écrite en dur :
           1. ce fichier est servi pour TOUTES les adresses du site (`try_files …
              /index.html`), or la photo dépend de l'adresse, et sur /athletes de
              la vue (`?sexe=femme`, `?tab=records`) ;
           2. surtout, des conditions de média dans `imagesizes` ne fonctionnent
              PAS ici. Elles sont évaluées à l'insertion du lien, avant que la
              largeur de mise en page du téléphone ne soit établie :
              `(max-width: 639px)` n'y était jamais vraie, le navigateur
              préchargeait la variante 1280 puis <Chapter> demandait la 768 — DEUX
              fichiers, et un LCP DÉGRADÉ de ~120 ms (mesuré). La largeur
              d'affichage est donc calculée ici, en pixels, à partir de
              `innerWidth`, qui est déjà juste.

         Le navigateur choisit ensuite lui-même dans le MÊME srcset que celui que
         rendra <Chapter> : même liste, même largeur, donc même fichier, qu'il ne
         télécharge qu'une fois. La table est écrite à la compilation
         (`landingHeroPreload`, vite.config.ts) à partir de src/data/pageHeroes.ts
         et par la fonction même du rendu (src/lib/localPhotos.ts). Le 0,7 sous
         640 px est le plafond de densité `PHONE_PHOTO_CAP` de
         src/lib/cloudinary.ts : les deux doivent bouger ensemble — sinon l'onglet
         réseau montre la photo en double. -->
    <script>
      ;(function () {
        var heroes = /*LANDING_HEROES*/ {}
        var page = location.pathname.replace(/\/+$/, '') || '/'
        if (page === '/athletes') {
          var q = new URLSearchParams(location.search)
          if (q.get('tab') === 'records') page += '?tab=records'
          else if (/^(homme|femme)$/.test(q.get('sexe') || '')) page += '?sexe=' + q.get('sexe')
        }
        var hero = heroes[page]
        if (!hero) return
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.fetchPriority = 'high'
        if (hero[1]) {
          l.setAttribute('imagesrcset', hero[1])
          l.setAttribute('imagesizes', (innerWidth <= 639 ? innerWidth * 0.7 : innerWidth) + 'px')
        } else {
          l.href = hero[0]
        }
        document.head.appendChild(l)
      })()
    </script>
    <title>BEC Athlétisme</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
